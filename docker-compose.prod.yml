# NextClinic ERP — pile Docker de production : MySQL, API, front servi par Caddy (HTTPS automatique).
#
# Variables : .env.prod (copier .env.prod.example ; jamais commité, chmod 600).
# Exploitation par les scripts (ils passent --env-file et le nom de projet) :
#   scripts/deploy.sh          installation ou mise à jour : build, schéma, compte limité, redémarrage
#   scripts/seed-catalogue.sh  catalogue d'examens courants (idempotent)
#   scripts/backup.sh          sauvegarde base + fichiers, rotation
#   scripts/restore.sh         restauration d'une sauvegarde
#   scripts/rollback.sh        retour à une version précédente des images
# Commande directe équivalente : docker compose --env-file .env.prod -f docker-compose.prod.yml <commande>
#
# Exposé sur Internet : seul le proxy (80, 443). La base est sur un réseau interne, sans port publié.
# L'API doit rester à UNE seule instance : rappels horaires et connexions temps réel sont gérés en mémoire.

name: nextclinic

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME requis}
      # Sur base neuve, ce compte reçoit tous les droits de la base. Il est
      # distinct du compte limité de l'API (repli historique pour bases existantes).
      MYSQL_USER: ${DB_BOOTSTRAP_USER:-${DB_USER:?DB_USER requis}}
      MYSQL_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD requis}}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requis}
      # Même fuseau que l'ancienne base (dates calculées en SQL)
      TZ: ${TZ:-Africa/Casablanca}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    build: ./server
    image: nextclinic-api:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      TZ: ${TZ:-Africa/Casablanca}
      CLINIC_TZ: ${TZ:-Africa/Casablanca}
      # Une seule couche de proxy (Caddy) : IP réelle du client pour la limitation des connexions
      TRUST_PROXY: "1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL requis}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
    volumes:
      # Photos, logos, résultats d'examens, scans de CIN : sauvegardés avec la base (scripts/backup.sh)
      - uploads:/app/uploads
    networks: [db, web]
    # Santé : HEALTHCHECK de server/Dockerfile (/api/health, 503 si la base est injoignable)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  # Installation et mise à jour du schéma (idempotent), avec un compte administratif distinct.
  # Jamais lancée par `up` : scripts/deploy.sh l'exécute avant chaque redémarrage de l'API.
  db-install:
    extends:
      service: api
    profiles: [install]
    restart: "no"
    environment:
      DB_USER: ${DB_MIGRATION_USER:-}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
    healthcheck:
      disable: true
    command:
      - sh
      - -ec
      - 'test -n "$$DB_USER" && test -n "$$DB_PASSWORD" || { echo "DB_MIGRATION_USER et DB_MIGRATION_PASSWORD requis" >&2; exit 1; }; exec npm run db:install'

  # Compte applicatif limité de l'API (DB_USER / DB_PASSWORD), droits par table. Idempotent ;
  # relancé par scripts/deploy.sh et scripts/restore.sh (les droits suivent les tables).
  db-app-account:
    image: mysql:8.4.13
    profiles: [install]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_USER: ${DB_USER}
      APP_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["sh", "/scripts/create-app-account.sh"]
    volumes:
      - ./docker/create-app-account.sh:/scripts/create-app-account.sh:ro
    networks: [db]

  # Front compilé + reverse proxy (/api, /uploads, /socket.io) ; HTTPS automatique sur SITE_ADDRESS
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: nextclinic-web:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificats HTTPS : à conserver (sinon nouvelle demande à chaque recréation)
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    healthcheck:
      # API d'administration de Caddy, locale au conteneur : le serveur web répond
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  # Base de données : réseau interne, sans accès à Internet ni au proxy
  db:
    internal: true
  # Proxy ↔ API ; l'API y garde l'accès sortant (SMTP, API d'IA)
  web:
